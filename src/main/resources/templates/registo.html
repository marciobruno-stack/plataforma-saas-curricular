<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registo de Formador - SaaS Curricular</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 340px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: .5rem; font-weight: bold; }
        input { width: 100%; padding: .5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: .75rem; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #218838; }
        .alert { color: red; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Criar Conta de Formador</h2>

    <div th:if="${erro}" class="alert" th:text="${erro}"></div>

    <form th:action="@{/registo}" th:object="${utilizador}" method="post">
        <div class="form-group">
            <label>Nome Completo:</label>
            <input type="text" th:field="*{nome}" required autofocus />
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" required />
        </div>
        <button type="submit">Registar</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        Já tem conta? <a th:href="@{/login}">Fazer Login</a>
    </p>
</div>

</body>
</html>
