<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Plataforma SaaS Curricular</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- Podemos incluir bibliotecas extra aqui -->
</head>
<body>

<!-- Sidebar Fragment -->
<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div style="flex-grow: 1; overflow-y: auto;">
        <div class="container">
            <!-- Alert Messages -->
            <div th:if="${param.sucesso}" class="card" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; margin-bottom: 1rem;">
                Ação realizada com sucesso!
            </div>
            <div th:if="${param.apagada}" class="card" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; margin-bottom: 1rem;">
                Registo apagado com sucesso!
            </div>
            <div th:if="${param.erro}" class="card" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; margin-bottom: 1rem;">
                Ocorreu um erro na operação. Pode não ter permissões.
            </div>
            <div th:if="${mensagemSucesso}" class="card" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; margin-bottom: 1rem;" th:text="${mensagemSucesso}">
            </div>
            <div th:if="${mensagemErro}" class="card" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; margin-bottom: 1rem;" th:text="${mensagemErro}">
            </div>

            <!-- Content Fragment from other pages -->
            <div layout:fragment="content">
                <!-- O conteúdo específico das outras páginas será injetado aqui -->
            </div>
        </div>
    </div>
</div>

</body>
</html>
