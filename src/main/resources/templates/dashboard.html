<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Dashboard - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <h2 class="mt-0">Bem-vindo!</h2>
        <p class="text-muted">Este é o teu espaço pessoal (isolado). Aqui poderás gerir as tuas Perguntas e Fichas de Trabalho nos próximos dias.</p>
    </div>

    <div class="card">
        <h3 class="mt-0">Estatísticas Rápidas</h3>
        <p>As tuas fichas: <span th:text="${totalFichas}">0</span></p>
        <p>As tuas perguntas: <span th:text="${totalPerguntas}">0</span></p>
    </div>
</div>

</body>
</html>
