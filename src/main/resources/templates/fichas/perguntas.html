<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Perguntas da Ficha - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <h2 class="mt-0">Perguntas da Ficha: <span class="text-primary" th:text="${ficha.titulo}"></span></h2>
        
        <h3 class="mt-4">Perguntas Incluídas</h3>
        <table th:if="${!ficha.perguntas.isEmpty()}">
            <thead>
                <tr>
                    <th>Enunciado</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pergunta : ${ficha.perguntas}">
                    <td th:text="${pergunta.enunciado}">Enunciado</td>
                    <td th:text="${pergunta.tipo}">Tipo</td>
                    <td>
                        <form th:action="@{/fichas/{id}/perguntas/{perguntaId}(id=${ficha.id}, perguntaId=${pergunta.id})}" method="post" class="inline-form" onsubmit="return confirm('Tem a certeza que deseja remover esta pergunta da ficha?');">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${ficha.perguntas.isEmpty()}" class="text-muted">Ainda não existem perguntas nesta ficha.</p>

        <h3 class="mt-4">Adicionar Pergunta Existente</h3>
        <form th:action="@{/fichas/{id}/perguntas(id=${ficha.id})}" method="post">
            <div class="form-group">
                <label for="perguntaId">Escolhe uma pergunta:</label>
                <select id="perguntaId" name="perguntaId" required>
                    <option value="" disabled selected>-- Seleciona uma pergunta --</option>
                    <option th:each="pergunta : ${todasPerguntas}" 
                            th:if="${!ficha.perguntas.contains(pergunta)}"
                            th:value="${pergunta.id}" 
                            th:text="${pergunta.enunciado} + ' (' + ${pergunta.tipo} + ')'"></option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Adicionar Pergunta</button>
            <a th:href="@{/fichas}" class="btn btn-secondary">Voltar às Fichas</a>
        </form>
    </div>
</div>

</body>
</html>
