<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Resultados da Ficha - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <a th:href="@{/fichas}" class="btn-back">← Voltar às Minhas Fichas</a>

            <div class="card">
                <h2 style="margin-top: 0;">Resultados da Ficha: <span style="color: #007bff;" th:text="${ficha.titulo}">Título</span></h2>
                <p style="color: #666;">Abaixo encontras todos os alunos que já resolveram esta ficha através do link público.</p>

                <div th:if="${#lists.isEmpty(resolucoes)}">
                    <p style="color: #666; margin-top: 20px;">Ainda não há resoluções para esta ficha.</p>
                </div>

                <div th:each="resolucao : ${resolucoes}" style="margin-bottom: 15px;">
                    <details>
                        <summary>
                            <span style="display: inline-block; width: 300px;" th:text="${resolucao.nomeAluno}">João Silva</span>
                            <span style="display: inline-block; width: 200px; color: #666;">
                                <span th:text="${#temporals.format(resolucao.dataResolucao, 'dd/MM/yyyy HH:mm')}">Data</span>
                            </span>
                            <span style="display: inline-block; width: 150px; color: #28a745;">
                                <span th:text="${resolucao.tempoGastoSegundos / 60}">0</span>m <span th:text="${resolucao.tempoGastoSegundos % 60}">0</span>s
                            </span>
                        </summary>
                        
                        <div class="details-content">
                            <div th:each="resposta : ${resolucao.respostas}" style="margin-bottom: 15px;">
                                <div class="answer-title" th:text="${resposta.pergunta.enunciado}">Pergunta</div>
                                <div class="answer-box" th:text="${resposta.textoResposta}">Resposta do aluno...</div>
                            </div>
                        </div>
                    </details>
                </div>
            </div>
</div>

</body>
</html>
