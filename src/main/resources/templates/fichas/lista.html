<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Minhas Fichas - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mt-0 mb-0">As Minhas Fichas</h2>
            <a th:href="@{/fichas/nova}" class="btn btn-success mb-0">Nova Ficha</a>
        </div>
        
        <table th:if="${!fichas.isEmpty()}">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th style="width: 320px;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ficha : ${fichas}">
                    <td th:text="${ficha.titulo}">Título</td>
                    <td th:text="${ficha.descricao}">Descrição</td>
                    <td style="display: flex; gap: 5px;">
                        <a th:href="@{/fichas/{id}/perguntas(id=${ficha.id})}" class="btn btn-warning btn-sm">Perguntas</a>
                        <a th:href="@{/fichas/publicar/{id}(id=${ficha.id})}" class="btn btn-success btn-sm">Publicar</a>
                        
                        <div class="dropdown">
                            <button class="btn btn-secondary btn-sm dropdown-btn">Ações ▼</button>
                            <div class="dropdown-content">
                                <button th:onclick="navigator.clipboard.writeText(window.location.origin + '/aluno/ficha/' + [[${ficha.codigoAcessoPublico}]]); alert('Link de Execução copiado!');">🔗 Copiar Link</button>
                                <a th:href="@{/fichas/{id}/resultados(id=${ficha.id})}">📊 Resultados</a>
                                <a th:href="@{/fichas/editar/{id}(id=${ficha.id})}">✏️ Editar</a>
                                <a th:href="@{/fichas/{id}/exportar/pdf(id=${ficha.id})}" target="_blank">📄 Exportar PDF</a>
                                <a th:href="@{/fichas/{id}/exportar/moodle(id=${ficha.id})}" target="_blank">📦 Exportar Moodle</a>
                                <form th:action="@{/fichas/{id}(id=${ficha.id})}" method="post" onsubmit="return confirm('Tem a certeza que deseja apagar?');" style="margin: 0; padding: 0;">
                                    <input type="hidden" name="_method" value="delete" />
                                    <button type="submit" style="color: #dc3545;">🗑️ Apagar</button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <table th:if="${fichas.isEmpty()}">
            <tbody>
                <tr>
                    <td colspan="3" class="text-center text-muted">Não tens nenhuma ficha criada. Começa por criar uma Nova Ficha!</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
