<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Minhas Fichas - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>As Minhas Fichas de Trabalho</h2>
            <a th:href="@{/fichas/nova}" class="btn btn-success" style="margin-bottom: 0;">Nova Ficha</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th style="width: 300px;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ficha : ${fichas}">
                    <td th:text="${ficha.id}">1</td>
                    <td th:text="${ficha.titulo}">Título</td>
                    <td th:text="${ficha.descricao}">Desc</td>
                    <td>
                        <button style="background-color: #6c757d; color: white; padding: 0.3rem 0.6rem; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;" 
                                th:onclick="navigator.clipboard.writeText(window.location.origin + '/aluno/ficha/' + [[${ficha.codigoAcessoPublico}]]); alert('Link de Execução copiado!');">Copiar Link</button>
                        
                        <a th:href="@{/fichas/{id}/perguntas(id=${ficha.id})}" class="btn" style="background-color: #ffc107; color: black; padding: 0.3rem 0.6rem;">Perguntas</a>
                        <a th:href="@{/fichas/{id}/resultados(id=${ficha.id})}" class="btn" style="background-color: #17a2b8; color: white; padding: 0.3rem 0.6rem;">Resultados</a>
                        
                        <a th:href="@{/fichas/publicar/{id}(id=${ficha.id})}" class="btn" style="background-color: #28a745; color: white; padding: 0.3rem 0.6rem;">Publicar</a>
                        <a th:href="@{/fichas/editar/{id}(id=${ficha.id})}" class="btn btn-primary" style="padding: 0.3rem 0.6rem;">Editar</a>
                        <form th:action="@{/fichas/{id}(id=${ficha.id})}" method="post" style="display: inline;" onsubmit="return confirm('Tem a certeza?');">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger" style="padding: 0.3rem 0.6rem;">Apagar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(fichas)}">
                    <td colspan="4" style="text-align: center;">Não tens nenhuma ficha criada. Começa por criar uma Nova Ficha!</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
