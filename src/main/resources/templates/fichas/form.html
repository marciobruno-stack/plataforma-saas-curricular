<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Gerir Ficha - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <h2 th:text="${ficha.id == null ? 'Nova Ficha de Trabalho' : 'Editar Ficha de Trabalho'}">Nova Ficha</h2>
        
        <form th:action="@{${ficha.id == null ? '/fichas' : '/fichas/' + ficha.id}}" th:object="${ficha}" method="post">
            <input type="hidden" name="_method" value="put" th:if="${ficha.id != null}" />
            <div class="form-group">
                <label>Título:</label>
                <input type="text" th:field="*{titulo}" required autofocus />
            </div>
            
            <div class="form-group">
                <label>Descrição:</label>
                <textarea th:field="*{descricao}" rows="4"></textarea>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/fichas}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

</body>
</html>
