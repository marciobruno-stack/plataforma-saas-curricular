<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Publicar Ficha - SaaS Curricular</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .header-links a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .container { padding: 2rem; max-width: 600px; margin: 40px auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
        .btn-submit:hover { background-color: #0056b3; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center;">
        <h1 style="margin-right: 30px;">SaaS Curricular</h1>
        <div class="header-links">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/fichas}">As Minhas Fichas</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2 style="margin-top: 0;">Publicar Ficha</h2>
        <p style="color: #666; margin-bottom: 20px;">Estás prestes a partilhar a ficha <strong>"<span th:text="${ficha.titulo}">Titulo</span>"</strong> com os teus colegas de uma instituição.</p>
        
        <form th:action="@{/fichas/publicar/{id}(id=${ficha.id})}" method="post">
            <div class="form-group">
                <label for="disciplinaId">Escolhe a Disciplina de Destino:</label>
                <select id="disciplinaId" name="disciplinaId" required>
                    <option value="" disabled selected>-- Seleciona a Instituição e Disciplina --</option>
                    <optgroup th:each="inst : ${instituicoes}" th:label="${inst.nome}">
                        <option th:each="disc : ${inst.disciplinas}" th:value="${disc.id}" th:text="${disc.nome} + ' (' + ${disc.anoEscolaridade} + ')'"></option>
                    </optgroup>
                </select>
            </div>
            
            <button type="submit" class="btn-submit">Partilhar Ficha</button>
            <a th:href="@{/fichas}" class="btn-back">Cancelar e Voltar</a>
        </form>
    </div>
</div>

</body>
</html>
