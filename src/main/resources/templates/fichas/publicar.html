<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Publicar Ficha - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <h2 class="mt-0">Publicar Ficha</h2>
        <p class="text-muted mb-4">Estás prestes a partilhar a ficha <strong>"<span th:text="${ficha.titulo}">Titulo</span>"</strong> com os teus colegas de uma instituição.</p>
        
        <form th:action="@{/fichas/publicar/{id}(id=${ficha.id})}" method="post">
            <div class="form-group">
                <label for="disciplinaId">Escolhe a Disciplina de Destino:</label>
                <select id="disciplinaId" name="disciplinaId" required>
                    <option value="" disabled selected>-- Seleciona a Instituição e Disciplina --</option>
                    <optgroup th:each="inst : ${instituicoes}" th:label="${inst.nome}">
                        <option th:each="disc : ${inst.disciplinas}" th:value="${disc.id}" th:text="${disc.nome} + ' (' + ${disc.anoEscolaridade} + ')'"></option>
                    </optgroup>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Partilhar Ficha</button>
            <a th:href="@{/fichas}" class="btn btn-secondary">Cancelar e Voltar</a>
        </form>

        <h3 class="mt-4">Onde está publicada?</h3>
        <table th:if="${!ficha.disciplinasPartilhadas.isEmpty()}">
            <thead>
                <tr>
                    <th>Instituição</th>
                    <th>Disciplina</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="disc : ${ficha.disciplinasPartilhadas}">
                    <td th:text="${disc.instituicao.nome}">Instituição</td>
                    <td th:text="${disc.nome}">Disciplina</td>
                    <td>
                        <form th:action="@{/fichas/publicar/{id}/{disciplinaId}(id=${ficha.id}, disciplinaId=${disc.id})}" method="post" class="inline-form" onsubmit="return confirm('Tem a certeza que deseja remover esta partilha?');">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger btn-sm">Despublicar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        <p th:if="${ficha.disciplinasPartilhadas.isEmpty()}" class="text-muted">Ainda não partilhaste esta ficha com nenhuma disciplina.</p>
    </div>
</div>

</body>
</html>
