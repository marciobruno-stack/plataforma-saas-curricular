<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Minhas Instituições - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div th:if="${mensagemSucesso}" class="alert-success" th:text="${mensagemSucesso}"></div>
    <div th:if="${mensagemErro}" class="alert-error" th:text="${mensagemErro}"></div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Minhas Instituições</h2>
            <div>
                <a th:href="@{/instituicoes/nova}" class="btn-primary">+ Criar Escola</a>
                <a th:href="@{/instituicoes/aderir}" class="btn-secondary">Aderir com Código</a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(instituicoes)}">
            <p style="color: #666; margin-top: 20px;">Não pertences a nenhuma instituição no momento.</p>
        </div>

        <table th:unless="${#lists.isEmpty(instituicoes)}">
            <thead>
                <tr>
                    <th>Nome da Escola</th>
                    <th>Código de Acesso</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inst : ${instituicoes}">
                    <td th:text="${inst.nome}">Escola Teste</td>
                    <td><strong th:text="${inst.codigoAcesso}">CODIGO</strong></td>
                    <td>
                        <a th:href="@{/instituicoes/{id}(id=${inst.id})}" class="btn-view">Ver Disciplinas</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
