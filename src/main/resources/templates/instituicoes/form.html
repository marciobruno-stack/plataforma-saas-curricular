<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Criar Instituição - SaaS Curricular</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .header-links a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .container { padding: 2rem; max-width: 600px; margin: 40px auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
        .btn-submit:hover { background-color: #218838; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>


<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div style="flex-grow: 1; overflow-y: auto;">
<div class="container">

    <div class="card">
        <h2 style="margin-top: 0;">Nova Instituição (Escola)</h2>
        <p style="color: #666; margin-bottom: 20px;">Cria a tua escola para começares a gerir disciplinas. Serás adicionado automaticamente, e os teus colegas poderão usar o Código de Acesso para entrar também.</p>
        
        <form th:action="@{/instituicoes/nova}" th:object="${instituicao}" method="post">
            <div class="form-group">
                <label for="nome">Nome Oficial da Escola</label>
                <input type="text" id="nome" th:field="*{nome}" required placeholder="Ex: Escola Secundária Camões" />
            </div>
            
            <button type="submit" class="btn-submit">Criar Instituição e Gerar Código</button>
            <a th:href="@{/instituicoes}" class="btn-back">Cancelar e Voltar</a>
        </form>
    </div>
</div>

</div>
</div>
</body>
</html>
