<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Aderir a Instituição - SaaS Curricular</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .header-links a { color: white; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .container { padding: 2rem; max-width: 600px; margin: 40px auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px dashed #007bff; border-radius: 4px; box-sizing: border-box; font-size: 1.2rem; text-align: center; text-transform: uppercase; font-family: monospace; letter-spacing: 2px; }
        .btn-submit { background-color: #17a2b8; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #138496; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>

<div class="header">
    <div style="display: flex; align-items: center;">
        <h1 style="margin-right: 30px;">SaaS Curricular</h1>
        <div class="header-links">
            <a th:href="@{/dashboard}">Dashboard</a>
            <a th:href="@{/instituicoes}">Instituições</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2 style="margin-top: 0;">Aderir a uma Instituição</h2>
        <p style="color: #666; margin-bottom: 20px;">Se um colega já criou a Escola na plataforma, pede-lhe o <strong>Código de Acesso</strong> único e insere-o abaixo para entrares.</p>
        
        <form th:action="@{/instituicoes/aderir}" method="post">
            <div class="form-group">
                <label for="codigoAcesso">Código de Acesso (8 Letras)</label>
                <input type="text" id="codigoAcesso" name="codigoAcesso" required placeholder="XXXXXXXX" maxlength="8" />
            </div>
            
            <button type="submit" class="btn-submit">Validar Código e Entrar</button>
            <a th:href="@{/instituicoes}" class="btn-back">Cancelar e Voltar</a>
        </form>
    </div>
</div>

</body>
</html>
