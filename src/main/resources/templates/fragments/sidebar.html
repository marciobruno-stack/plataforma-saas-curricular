<!-- Fragmento da Barra Lateral Slim (Estilo Discord/Slack) -->
<div th:fragment="sidebar" class="sidebar">
    
    <!-- Home / Dashboard -->
    <a th:href="@{/dashboard}" class="sidebar-item" title="Dashboard">
        🏠
    </a>

    <!-- Divisor -->
    <div class="sidebar-divider"></div>
    
    <!-- Instituições (Bolinhas) -->
    <div th:each="inst : ${minhasInstituicoes}">
        <a th:href="@{/instituicoes/{id}(id=${inst.id})}" class="sidebar-item inst-item" th:title="${inst.nome}" th:text="${#strings.substring(inst.nome,0,1)}">
            A
        </a>
    </div>
    
    <!-- Adicionar Nova Instituição -->
    <a th:href="@{/instituicoes/aderir}" class="sidebar-add" title="Aderir ou Criar Instituição">
        +
    </a>
</div>
