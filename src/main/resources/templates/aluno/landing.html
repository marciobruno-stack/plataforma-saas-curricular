<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Portal do Aluno - SaaS Curricular</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #007bff; margin-top: 0; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .btn-submit { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
        .btn-submit:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h1>Bem-vindo!</h1>
    <p>Estás prestes a iniciar a ficha: <br> <strong><span th:text="${ficha.titulo}">Ficha Exemplo</span></strong></p>
    
    <form th:action="@{/aluno/ficha/{codigo}/iniciar(codigo=${codigo})}" method="post">
        <div class="form-group">
            <label for="nomeAluno">Insere o teu Nome e N.º:</label>
            <input type="text" id="nomeAluno" name="nomeAluno" required placeholder="Ex: João Silva, nº 14" />
        </div>
        
        <button type="submit" class="btn-submit">Iniciar Ficha</button>
    </form>
</div>

</body>
</html>
