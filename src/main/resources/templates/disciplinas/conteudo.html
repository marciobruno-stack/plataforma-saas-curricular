<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Disciplina - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <div class="mb-4">
            <a th:href="@{/instituicoes/{id}(id=${disciplina.instituicao.id})}" class="btn btn-secondary mb-3">← Voltar para a Instituição</a>
            
            <h2 class="mt-0 text-primary">
                <span th:text="${disciplina.nome}">Disciplina</span> (<span th:text="${disciplina.anoEscolaridade}">Ano</span>)
            </h2>
            <p class="text-muted">Fichas partilhadas publicamente por todos os formadores nesta disciplina.</p>
        </div>

        <div th:if="${#lists.isEmpty(fichas)}">
            <p class="text-muted mt-4">Nenhuma ficha foi partilhada nesta disciplina ainda.</p>
        </div>

        <table th:unless="${#lists.isEmpty(fichas)}">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Autor Original</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ficha : ${fichas}">
                    <td th:text="${ficha.titulo}">Ficha Exemplo</td>
                    <td th:text="${ficha.descricao}">Descrição</td>
                    <td><strong th:text="${ficha.formador.nome}">João</strong></td>
                    <td>
                        <!-- Botão Clonar -->
                        <form th:action="@{/fichas/clonar/{id}(id=${ficha.id})}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-success btn-sm" title="Copiar para as Minhas Fichas">Clonar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
