<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Gerir Pergunta - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="card">
        <h2 th:text="${pergunta.id == null ? 'Nova Pergunta' : 'Editar Pergunta'}">Nova Pergunta</h2>
        
        <form th:action="@{${pergunta.id == null ? '/perguntas' : '/perguntas/' + pergunta.id}}" th:object="${pergunta}" method="post">
            <input type="hidden" name="_method" value="put" th:if="${pergunta.id != null}" />
            <div class="form-group">
                <label>Enunciado da Pergunta:</label>
                <textarea th:field="*{enunciado}" rows="5" required autofocus></textarea>
            </div>
            
            <div class="form-group">
                <label>Tipo de Pergunta:</label>
                <select th:field="*{tipo}" required>
                    <option value="TEXTO_LIVRE">Texto Livre (Desenvolvimento)</option>
                    <option value="ESCOLHA_MULTIPLA">Escolha Múltipla</option>
                    <option value="VERDADEIRO_FALSO">Verdadeiro ou Falso</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/perguntas}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

</body>
</html>
