<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Minhas Perguntas - SaaS Curricular</title>
</head>
<body>

<div layout:fragment="content">
    <div class="content-area">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mt-0 mb-0">As Minhas Perguntas</h2>
            <div>
                <a th:href="@{/perguntas/importar}" class="btn btn-secondary mr-2" style="background-color: #f39c12; color: white; border: none;">Importar do Moodle</a>
                <a th:href="@{/perguntas/nova}" class="btn btn-primary">Nova Pergunta</a>
            </div>
        </div>

        <div th:if="${param.sucesso}" class="alert-success">
            Pergunta guardada com sucesso!
        </div>
        
        <div th:if="${param.importadas}" class="alert-success" th:text="'Foram importadas ' + ${param.importadas[0]} + ' perguntas do Moodle com sucesso!'">
        </div>

        <div th:if="${param.apagada}" class="alert-success">
            Pergunta apagada!
        </div>
        <div th:if="${param.erro}" class="alert alert-danger">Erro: Operação não autorizada.</div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Enunciado</th>
                    <th>Tipo</th>
                    <th style="width: 150px;">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pergunta : ${perguntas}">
                    <td th:text="${pergunta.id}">1</td>
                    <td th:text="${pergunta.enunciado}">Enunciado</td>
                    <td th:text="${pergunta.tipoFormatado}">Tipo</td>
                    <td>
                        <a th:href="@{/perguntas/{id}/anexos(id=${pergunta.id})}" class="btn btn-info" style="padding: 0.3rem 0.6rem; color: white;">Anexos</a>
                        <a th:if="${pergunta.tipo == 'ESCOLHA_MULTIPLA'}" th:href="@{/perguntas/{id}/opcoes(id=${pergunta.id})}" class="btn btn-warning" style="padding: 0.3rem 0.6rem;">Opções</a>
                        <a th:href="@{/perguntas/editar/{id}(id=${pergunta.id})}" class="btn btn-primary" style="padding: 0.3rem 0.6rem;">Editar</a>
                        <form th:action="@{/perguntas/{id}(id=${pergunta.id})}" method="post" style="display: inline;" onsubmit="return confirm('Tem a certeza?');">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-danger" style="padding: 0.3rem 0.6rem;">Apagar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(perguntas)}">
                    <td colspan="4" style="text-align: center;">Não tens nenhuma pergunta no teu banco de dados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
